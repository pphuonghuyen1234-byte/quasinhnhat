<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ô chữ bí mật</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&subset=vietnamese&display=swap" rel="stylesheet">
<style>
:root{--bg:#fde7ee;--ink:#5b2a3f;--accent:#d63f7a;--rose:#ff8fb1;--panel:#fff;--line:#f7bfd0;--key:#ffd86b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1620;--ink:#fde4ec;--accent:#ff9cbc;--panel:#3a2230;--line:#6a3a50}}
:root[data-theme="dark"]{--bg:#2a1620;--ink:#fde4ec;--accent:#ff9cbc;--panel:#3a2230;--line:#6a3a50}
body{background:var(--bg);color:var(--ink);font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-size:18px;margin:0;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:22px 16px 44px;box-sizing:border-box}
h1{font-size:2rem;color:var(--accent);margin:0 0 4px;font-weight:700;line-height:1.2}
p{margin:0 0 14px;line-height:1.45}
#name,#from{font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 14px;width:100%;box-sizing:border-box;margin-bottom:10px}
#name::placeholder,#from::placeholder{color:var(--ink);opacity:.5}
#name:focus-visible,#from:focus-visible,.clue input:focus-visible,#box:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
#grid{overflow-x:auto;margin:8px 0 18px;padding-bottom:4px}
.row{display:flex;margin-bottom:3px}
.cell{width:24px;height:28px;flex:none;margin-right:2px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;font-weight:700;color:var(--ink)}
.cell.on{background:var(--panel);border:2px solid var(--line);box-sizing:border-box}
.cell.key{background:var(--key);border:2px solid var(--rose);box-sizing:border-box;color:#5b2a3f}
.cell.gap{background:transparent}
.clue{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:10px 14px;margin-bottom:10px}
.clue.done{opacity:.65}
.clue label{display:block;margin-bottom:4px;line-height:1.35}
.clue input{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--rose);width:100%;padding:4px 0;text-transform:uppercase;letter-spacing:.1em}
#win{display:none;background:#ffc2d6;color:#5b2a3f;border-radius:20px;padding:16px;margin-bottom:16px;text-align:center;line-height:1.4}
#win b{display:block;font-size:2rem;letter-spacing:.12em}
#gift{display:none;text-align:center;margin-bottom:16px}
#box{font-size:5rem;background:none;border:0;cursor:pointer;line-height:1;padding:8px}
#card{display:none;background:var(--panel);color:var(--ink);border:2px solid var(--rose);border-radius:20px;padding:18px;text-align:left;line-height:1.55}
#card h2{font-size:1.5rem;color:var(--accent);font-weight:700;margin:0 0 8px}
#card p{margin:0 0 10px}
.pop{position:fixed;top:-30px;font-size:26px;animation:fall 2.4s ease-in forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:10;width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--ink);font-size:1.4rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.pop.face{width:60px;height:60px;border-radius:50%;object-fit:cover;border:3px solid var(--rose);box-sizing:border-box;background:var(--panel)}
.snd:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.pop{display:none}}
</style>
</head>
<body>
<button id="snd" class="snd" aria-label="Bật/tắt nhạc" aria-pressed="false">🔇</button>
<main>
  <h1>Ô chữ bí mật 🎀</h1>
  <p>Giải 8 gợi ý về tiệc sinh nhật. Cột chữ vàng sẽ ghép thành lời chúc dành cho cô.</p>
  <input id="name" value="Cô Hồng Nhung" placeholder="Tên người nhận" maxlength="24" aria-label="Tên người nhận">
  <input id="from" placeholder="Tên bạn (người gửi)" maxlength="24" aria-label="Tên người gửi">
  <div id="win" role="status"></div>
  <div id="gift"><button id="box" aria-label="Mở quà">🎁</button><p id="boxHint">Giải xong rồi! Bấm vào hộp quà để mở nhé.</p><div id="card"></div></div>
  <div id="grid" aria-hidden="true"></div>
  <div id="clues"></div>
</main>
<script>
(function(){
var ctx=null,master=null,timer=null,playing=false,userOff=false,started=false;
var snd=document.getElementById('snd');
var N={G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,C6:1046.5};
// Happy Birthday: [nốt, số phách]
var SONG=[['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],
['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',3]];
var BEAT=.52;
function ensure(){
  if(!ctx){var A=window.AudioContext||window.webkitAudioContext;if(!A)return false;ctx=new A()}
  if(ctx.state==='suspended')ctx.resume();
  return true;
}
function tone(f,t,d,v,dest){
  [[f,v,'sine'],[f*2,v*.35,'sine'],[f*3,v*.12,'triangle']].forEach(function(p){
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.type=p[2];o.frequency.value=p[0];
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(p[1],t+.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.05);
  });
}
function loop(){
  if(!playing)return;
  var t=ctx.currentTime+.1;
  SONG.forEach(function(n){var d=n[1]*BEAT;tone(N[n[0]],t,Math.max(d*1.6,.35),.16,master);t+=d});
  timer=setTimeout(loop,(t-ctx.currentTime+1.2)*1000);
}
function start(){
  if(playing||!ensure())return;
  playing=true;started=true;
  master=ctx.createGain();master.gain.setValueAtTime(0.0001,ctx.currentTime);
  master.gain.linearRampToValueAtTime(1,ctx.currentTime+.4);
  master.connect(ctx.destination);
  loop();ui();
}
function stop(){
  if(!playing)return;
  playing=false;clearTimeout(timer);
  var m=master;m.gain.cancelScheduledValues(ctx.currentTime);
  m.gain.setValueAtTime(m.gain.value,ctx.currentTime);
  m.gain.linearRampToValueAtTime(0.0001,ctx.currentTime+.25);
  setTimeout(function(){m.disconnect()},400);
  ui();
}
function ui(){snd.textContent=playing?'🎵':'🔇';snd.setAttribute('aria-pressed',playing?'true':'false')}
snd.addEventListener('click',function(){
  if(playing){userOff=true;stop()}else{userOff=false;start()}
});
// Trình duyệt chỉ cho phát âm thanh sau khi người dùng chạm/gõ lần đầu
function first(e){
  if(started||userOff)return;
  if(e&&e.target&&e.target.closest&&e.target.closest('#snd'))return;
  start();
  if(started)['pointerdown','keydown','touchend'].forEach(function(ev){document.removeEventListener(ev,first,true)});
}
['pointerdown','keydown','touchend'].forEach(function(ev){document.addEventListener(ev,first,true)});
document.addEventListener('visibilitychange',function(){
  if(!ctx)return;
  if(document.hidden)ctx.suspend();else if(playing||!userOff)ctx.resume();
});
})();

function rain(n){

  row.className='row';
  for(var c=0;c<13;c++){

  }

  var box=document.createElement('div');box.className='clue';
